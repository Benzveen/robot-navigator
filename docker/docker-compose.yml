# ============================================
# Docker Compose — Full ROS 2 Nav2 Simulation
# ============================================
#
# Runs the complete Nav2 stack with Gazebo simulation.
# Your LLM agent connects via rosbridge WebSocket.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up
#   # Then run your agent on Mac:
#   PYTHONPATH=src python -m simulator.ros2_bridge

services:
  # ── ROS 2 Nav2 + Gazebo Simulation ──────────────────
  nav2-sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: robot-nav2-sim
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY:-:0}
      - LIBGL_ALWAYS_SOFTWARE=1  # Software rendering for headless
    ports:
      - "9090:9090"   # rosbridge WebSocket
      - "11345:11345" # Gazebo
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # X11 forwarding (optional)
      - ../maps:/ros2_ws/maps              # Share maps between host and container
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      echo '🚀 Starting ROS 2 Nav2 (no Gazebo — lightweight mode)...' &&
      echo '' &&
      echo '📡 Starting rosbridge on port 9090...' &&
      ros2 launch rosbridge_server rosbridge_websocket_launch.xml port:=9090 &
      sleep 2 &&
      echo '🗺️ Starting SLAM Toolbox...' &&
      ros2 launch slam_toolbox online_async_launch.py use_sim_time:=False &
      sleep 2 &&
      echo '🧭 Starting Nav2 navigation stack...' &&
      ros2 launch nav2_bringup navigation_launch.py use_sim_time:=False autostart:=True &
      sleep 2 &&
      echo '' &&
      echo '============================================' &&
      echo '✅ ROS 2 Nav2 stack is running!' &&
      echo '============================================' &&
      echo '📡 rosbridge WebSocket: ws://localhost:9090' &&
      echo '🗺️ SLAM Toolbox: active (waiting for /scan)' &&
      echo '🧭 Nav2: active (planner + controller + recovery)' &&
      echo '' &&
      echo 'Connect your LLM agent: make run-nav2' &&
      echo '============================================' &&
      wait"
    restart: unless-stopped

  # ── SLAM Mode (for mapping a new environment) ───────
  # Uncomment to run SLAM instead of localization
  # slam:
  #   build:
  #     context: ..
